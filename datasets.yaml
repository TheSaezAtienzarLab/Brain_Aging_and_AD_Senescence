# ═══════════════════════════════════════════════════════════════════════════════
# DATASET CONFIGURATIONS FOR SENESCENCE ANALYSIS PIPELINE
# ═══════════════════════════════════════════════════════════════════════════════
#
# This file contains dataset-specific configurations for all cohorts in the
# multi-cohort cellular senescence analysis.
#
# Usage:
#   1. Edit the 'input_file' paths for your data location
#   2. Adjust 'base_dir' in paths section for your system
#   3. Load in notebook: yaml.safe_load(open('config/datasets.yaml'))
#
# Last Updated: December 2025
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# DATASET CONFIGURATIONS
# ═══════════════════════════════════════════════════════════════════════════════

datasets:
  
  # ─────────────────────────────────────────────────────────────────────────────
  # PsychAD Aging Cohort
  # ─────────────────────────────────────────────────────────────────────────────
  psychad_aging:
    description: "PsychAD Aging cohort - Healthy aging (n=124, ages 20-80+)"
    input_file: /fs/scratch/PAS2598/data/psychad/aging_raw.h5ad
    
    # Metadata columns
    batch_key: Sample                    # Variable for Harmony batch correction
    cell_type_column: broad_class        # Column with cell type annotations
    sample_column: Sample                # Column identifying unique samples
    donor_column: Donor                  # Column identifying unique donors
    
    # Study design
    condition_column: null               # Not applicable (aging study)
    age_column: Age                      # Continuous age variable
    sex_column: sex                      # Sex variable
    cohort: psychad_aging                # Cohort identifier
    
    # Analysis metadata
    region: DLPFC                        # Brain region
    n_samples: 124
    analysis_type: aging                 # aging or disease
  
  # ─────────────────────────────────────────────────────────────────────────────
  # PsychAD AD Cohort
  # ─────────────────────────────────────────────────────────────────────────────
  psychad_ad:
    description: "PsychAD AD cohort - Control vs AD (n=172, ages 60+)"
    input_file: /fs/scratch/PAS2598/data/psychad/ad_raw.h5ad
    
    # Metadata columns
    batch_key: Sample
    cell_type_column: broad_class
    sample_column: Sample
    donor_column: Donor
    
    # Study design
    condition_column: Diagnosis          # Control vs AD
    age_column: Age
    sex_column: sex
    cohort: psychad_ad
    
    # Analysis metadata
    region: DLPFC
    n_samples: 172
    analysis_type: disease
  
  # ─────────────────────────────────────────────────────────────────────────────
  # PsychENCODE Cohort
  # ─────────────────────────────────────────────────────────────────────────────
  psychencode:
    description: "PsychENCODE - Healthy aging replication (n=69, ages 30-80+)"
    input_file: /fs/scratch/PAS2598/data/psychencode/raw.h5ad
    
    # Metadata columns
    batch_key: Donor                     # Different from PsychAD!
    cell_type_column: cell_type
    sample_column: Sample
    donor_column: Individual
    
    # Study design
    condition_column: null
    age_column: Age
    sex_column: Sex
    cohort: psychencode
    
    # Analysis metadata
    region: DLPFC
    n_samples: 69
    analysis_type: aging
  
  # ─────────────────────────────────────────────────────────────────────────────
  # Mathys Cohort
  # ─────────────────────────────────────────────────────────────────────────────
  mathys:
    description: "Mathys et al. - Control/MCI/AD (n=30, ages 70+)"
    input_file: /fs/scratch/PAS2598/data/mathys/raw.h5ad
    
    # Metadata columns
    batch_key: individual                # Different naming convention!
    cell_type_column: broad.cell.type
    sample_column: projid
    donor_column: individual
    
    # Study design
    condition_column: Diagnosis          # Control, MCI, AD
    age_column: age_death
    sex_column: msex
    cohort: mathys
    
    # Analysis metadata
    region: Frontal_Cortex
    n_samples: 30
    analysis_type: disease
  
  # ─────────────────────────────────────────────────────────────────────────────
  # Australian Brain Bank Cohort
  # ─────────────────────────────────────────────────────────────────────────────
  australian:
    description: "Australian Brain Bank - Control vs AD (n=71, ages 24-93)"
    input_file: /fs/scratch/PAS2598/data/australian/raw.h5ad
    
    # Metadata columns
    batch_key: projid                    # Different naming convention!
    cell_type_column: celltype
    sample_column: projid
    donor_column: projid
    
    # Study design
    condition_column: Condition          # Control vs AD
    age_column: Age
    sex_column: Gender
    cohort: australian
    
    # Analysis metadata
    region: Parietal
    n_samples: 71
    analysis_type: disease


# ═══════════════════════════════════════════════════════════════════════════════
# GLOBAL ANALYSIS PARAMETERS
# ═══════════════════════════════════════════════════════════════════════════════
# These parameters apply to all datasets unless overridden in dataset config

parameters:
  
  # ─────────────────────────────────────────────────────────────────────────────
  # Quality Control
  # ─────────────────────────────────────────────────────────────────────────────
  qc:
    min_genes: 200                       # Minimum genes detected per cell
    max_genes: 8000                      # Maximum genes (doublet removal)
    max_mt_percent: 5                    # Strict for snRNA-seq (nuclear RNA)
    min_cells: 3                         # Genes must be in ≥3 cells
    
    # Note: 5% MT is appropriate for nuclear RNA-seq
    # Adjust to 10-20% for whole-cell RNA-seq if needed
  
  # ─────────────────────────────────────────────────────────────────────────────
  # Normalization
  # ─────────────────────────────────────────────────────────────────────────────
  normalization:
    target_sum: 10000                    # Normalize to 10,000 counts per cell
    log_base: null                       # Use natural log (log1p)
  
  # ─────────────────────────────────────────────────────────────────────────────
  # Feature Selection
  # ─────────────────────────────────────────────────────────────────────────────
  feature_selection:
    n_top_genes: 2000                    # Number of highly variable genes
    flavor: seurat                       # HVG selection method
    subset: false                        # Keep all genes (don't subset to HVGs)
  
  # ─────────────────────────────────────────────────────────────────────────────
  # Scaling
  # ─────────────────────────────────────────────────────────────────────────────
  scaling:
    perform_scaling: true                # Whether to scale data
    max_value: 10                        # Clip scaled values
    store_in_layer: true                 # Save to layer, keep log-norm as active
    
    # Important: Scaling stored in layer, log-normalized remains active
    # Harmony/UMAP work better on log-normalized data
  
  # ─────────────────────────────────────────────────────────────────────────────
  # Dimensionality Reduction
  # ─────────────────────────────────────────────────────────────────────────────
  pca:
    n_pcs: 50                            # Number of principal components
    svd_solver: arpack                   # Solver method
    use_highly_variable: true            # Use HVGs for PCA
  
  # ─────────────────────────────────────────────────────────────────────────────
  # Batch Correction
  # ─────────────────────────────────────────────────────────────────────────────
  batch_correction:
    method: harmony                      # Harmony integration
    # batch_key defined per dataset (Sample, Donor, individual, projid)
  
  # ─────────────────────────────────────────────────────────────────────────────
  # Clustering
  # ─────────────────────────────────────────────────────────────────────────────
  clustering:
    n_neighbors: 30                      # K for neighbor graph
    leiden_resolution: 0.8               # Leiden clustering resolution
    leiden_flavor: igraph                # Fast implementation
    leiden_n_iterations: 2               # Iterations (fast for large data)
  
  # ─────────────────────────────────────────────────────────────────────────────
  # Visualization
  # ─────────────────────────────────────────────────────────────────────────────
  visualization:
    umap_min_dist: 0.3                   # UMAP minimum distance
    umap_spread: 1.0                     # UMAP spread
    figure_dpi: 300                      # Figure resolution
    save_formats:
      - pdf
      - png
  
  # ─────────────────────────────────────────────────────────────────────────────
  # Random Seed
  # ─────────────────────────────────────────────────────────────────────────────
  random_seed: 42                        # For reproducibility


# ═══════════════════════════════════════════════════════════════════════════════
# PATH CONFIGURATIONS
# ═══════════════════════════════════════════════════════════════════════════════

paths:
  # Base directory for all outputs
  base_dir: /fs/scratch/PAS2598/senescence_analysis
  
  # Subdirectories (relative to base_dir)
  output_subdir: data/processed
  figures_subdir: figures
  results_subdir: results
  
  # Specific module directories (relative to figures_subdir)
  module_figures:
    preprocessing: 00_preprocessing
    senescence: 01_senescence_scoring
    subclustering: 02_glial_subclustering
    demographics: 03_demographics
    composition: 04_composition_analysis
    statistics: 05_statistical_analysis
    deg: 06_deg_analysis
    downstream: 07_downstream_analysis


# ═══════════════════════════════════════════════════════════════════════════════
# CANONICAL MARKERS FOR VALIDATION
# ═══════════════════════════════════════════════════════════════════════════════
# Yang-style: 2-3 canonical markers per cell type for clean validation

canonical_markers:
  Excitatory:
    - SLC17A7
    - SATB2
  
  Inhibitory:
    - GAD1
    - GAD2
  
  Astrocyte:
    - SLC1A2
    - GFAP
    - AQP4
  
  Oligodendrocyte:
    - MBP
    - MOBP
    - MOG
  
  OPC:
    - PDGFRA
    - CSPG4
  
  Microglia:
    - CX3CR1
    - TMEM119
    - CSF1R
  
  Endothelial:
    - CLDN5
    - FLT1
  
  Pericyte:
    - PDGFRB
    - RGS5
  
  VLMC:
    - DCN
    - COL1A1
  
  VSMC:
    - MYH11
    - TAGLN


# ═══════════════════════════════════════════════════════════════════════════════
# NOTES
# ═══════════════════════════════════════════════════════════════════════════════
#
# Dataset-specific considerations:
#
# 1. Batch Keys:
#    - PsychAD: 'Sample' (technical replicates)
#    - PsychENCODE: 'Donor' (individual-level)
#    - Mathys: 'individual' (lowercase convention)
#    - Australian: 'projid' (project ID)
#
# 2. Cell Type Columns:
#    - PsychAD: 'broad_class' (consistent naming)
#    - PsychENCODE: 'cell_type'
#    - Mathys: 'broad.cell.type' (with dot)
#    - Australian: 'celltype' (one word)
#
# 3. MT% Threshold:
#    - 5% is strict but appropriate for high-quality snRNA-seq
#    - All datasets are nuclear RNA (not whole-cell)
#    - Adjust if needed for lower-quality samples
#
# 4. Data Layers:
#    - layers['counts']: Raw counts (for DESeq2)
#    - layers['normalized']: Normalized counts
#    - layers['log1p']: Log-normalized (active layer)
#    - layers['scaled']: Scaled data (if needed)
#    - .raw: Full log-normalized matrix
#
# 5. Adding New Datasets:
#    - Copy one of the existing dataset blocks
#    - Update all fields appropriately
#    - Ensure batch_key exists in your data
#    - Test with small subset first
#
# ═══════════════════════════════════════════════════════════════════════════════
